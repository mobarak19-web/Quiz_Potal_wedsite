
<!DOCTYPE html>
<html lan="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Quiz Management System{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .quiz-card {
            transition: 0.3s;
        }

        .quiz-card:hover {
            transform: translateY(-4px);
        }

        footer {
            margin-top: 60px;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="{% url 'dashboard' %}">
            Quiz System
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'dashboard' %}">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'participant_list' %}">
                        Participants
                    </a>
                </li>

                {% if user.is_authenticated %}

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'logout' %}">
                        Logout
                    </a>
                </li>

                {% else %}

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'user_login' %}">
                        Login
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'user_register' %}">
                        Register
                    </a>
                </li>

                {% endif %}

            </ul>

        </div>
    </div>
</nav>


<!-- Main Content -->
<main class="container py-5">

    {% block content %}
    {% endblock %}

</main>


<!-- Footer -->
<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">
        Quiz Management System &copy; 2026
    </p>
</footer>


<!-- Bootstrap 5 JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
